# ============================================================
# 前端独立部署 - Docker Compose
# 仅包含前端 Nginx 容器，适用于后端已独立运行的场景
#
# 使用方式:
#   docker compose -f deploy/docker-compose.frontend.yml up -d
#   # 访问 http://localhost:3000
# ============================================================

version: '3.8'

services:
  web-admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:80/ws}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-AI老年健康守护系统}
    container_name: ehc-web-admin
    restart: always
    ports:
      - "${WEB_PORT:-3000}:80"
    environment:
      NGINX_HOST: localhost
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    # 如果后端在同一台宿主机上，取消下面的注释以连接到后端网络
    # networks:
    #   - backend_network
    #
    # 如果需要挂载自定义 nginx 配置：
    # volumes:
    #   - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

# networks:
#   backend_network:
#     external: true
#     name: backend_default
