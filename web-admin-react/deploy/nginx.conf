# ============================================================
# AI 老年健康守护系统 - 前端 Nginx 配置
# 功能：静态文件服务 + SPA 路由 + API 反向代理 + WebSocket
# ============================================================

server {
    listen       80;
    server_name  _;

    # 字符集
    charset utf-8;

    # ---- 安全配置 ----
    server_tokens off;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml
        application/x-font-ttf
        font/opentype;

    # ---- 静态资源根目录 ----
    root   /usr/share/nginx/html;
    index  index.html;

    # ---- 安全响应头 ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; font-src 'self' data:;" always;

    # ---- 静态资源缓存策略 ----
    # HTML 文件不缓存，确保版本更新后用户立即获取最新页面
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 带 hash 的静态资源（JS/CSS/字体/图片）永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 其他静态文件短期缓存
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # ---- SPA 路由：所有非文件请求回退到 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API 反向代理(独立部署时使用) ----
    # 如果前端和后端在同一台服务器，取消下面的注释并修改 proxy_pass
    # location /api/ {
    #     proxy_pass http://api-gateway:80;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #
    #     # 超时配置
    #     proxy_connect_timeout 10s;
    #     proxy_send_timeout 30s;
    #     proxy_read_timeout 30s;
    #
    #     # 缓冲配置
    #     proxy_buffering off;
    #     proxy_request_buffering off;
    # }

    # ---- WebSocket 代理(独立部署时使用) ----
    # 如果前端需要直接代理 WebSocket，取消下面的注释
    # location /ws {
    #     proxy_pass http://api-gateway:80;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_read_timeout 86400s;
    # }

    # ---- 错误页面 ----
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
}
