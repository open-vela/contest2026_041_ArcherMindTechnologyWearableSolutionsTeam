# ============================================================
# 全栈集成 Nginx 配置 — 前端静态文件 + API 反向代理
# 同一个 80 端口同时服务前端页面和代理后端 API
# 用于替换后端 deploy/nginx.conf，实现前后端统一入口
# ============================================================

server {
    listen       80;
    server_name  _;

    charset utf-8;
    server_tokens off;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml application/x-font-ttf font/opentype;

    # ---- 安全响应头 ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 前端静态文件 ----
    root   /usr/share/nginx/html;
    index  index.html;

    # HTML 不缓存
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- SPA 路由回退 ----
    # 注意：必须在 API 代理之前，因为 try_files 只对文件系统生效
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API 反向代理（不对文件系统查找，直接代理） ----
    location /api/ {
        # 使用 = 精确优先，避免 try_files 干扰
        proxy_pass http://api-gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ---- WebSocket 代理 ----
    location /ws {
        proxy_pass http://api-gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ---- 后端 API 路由（透传原始的 11 个微服务路由） ----
    # 如果后端 api-gateway 已有独立路由，可直接代理所有 /api/ 请求
    # 下面的精确路由仅在需要绕过 api-gateway 直连微服务时使用

    # 用户服务
    location /api/v1/auth/ {
        proxy_pass http://admin-auth-service:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 管理员管理
    location /api/v1/admin/ {
        proxy_pass http://admin-auth-service:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 老人管理
    location /api/v1/elderly/ {
        proxy_pass http://user-service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 设备管理
    location /api/v1/devices/ {
        proxy_pass http://device-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 体征数据
    location /api/v1/vitals/ {
        proxy_pass http://user-service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 报警管理
    location /api/v1/alarms/ {
        proxy_pass http://alarm-service:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 签到管理
    location /api/v1/signin/ {
        proxy_pass http://signin-service:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 巡访管理
    location /api/v1/patrol/ {
        proxy_pass http://patrol-service:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康周报
    location /api/v1/reports/ {
        proxy_pass http://report-service:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 社区看板
    location /api/v1/dashboard/ {
        proxy_pass http://dashboard-service:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- 错误页面 ----
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
}
