worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    # ============ 限流配置 ============
    # IP 级别：每秒 100 请求
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    # 登录端点：每分钟 10 请求
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

    # ============ 上游服务集群 ============
    upstream user_service {
        server user-service:8001;
    }

    upstream device_service {
        server device-service:8002;
    }

    upstream alarm_service {
        server alarm-service:8004;
    }

    upstream signin_service {
        server signin-service:8005;
    }

    upstream admin_auth_service {
        server admin-auth-service:8011;
    }

    upstream dashboard_service {
        server dashboard-service:8010;
    }

    upstream patrol_service {
        server patrol-service:8006;
    }

    upstream report_service {
        server report-service:8008;
    }

    # ============ HTTP → HTTPS 重定向 ============
    server {
        listen 80;
        server_name _;

        # 健康检查可以直接用 HTTP
        location /health {
            return 200 '{"status":"UP"}';
        }

        # 其他重定向到 HTTPS (生产环境)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============ HTTPS 主服务 ============
    server {
        listen 443 ssl http2;
        server_name api.elderly-health.com;

        # SSL 证书（生产环境使用真实证书）
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # 通用限流
        limit_req zone=api_limit burst=50 nodelay;

        # CORS 头
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Request-ID" always;

        # ============ 用户服务 ============
        location /v1/auth/ {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /v1/elderly {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /v1/family-bindings {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /v1/communities {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ============ 设备服务 ============
        location /v1/devices {
            proxy_pass http://device_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============ 体征数据服务 ============
        location /v1/vitals {
            proxy_pass http://device_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ============ 报警服务 ============
        location /v1/alarms {
            proxy_pass http://alarm_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /v1/alarm-rules {
            proxy_pass http://alarm_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ============ 签到服务 ============
        location /v1/signin {
            proxy_pass http://signin_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============ 巡访服务 ============
        location /v1/patrol {
            proxy_pass http://patrol_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============ 周报服务 ============
        location /v1/health-reports {
            proxy_pass http://report_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============ 看板服务 ============
        location /v1/dashboard {
            proxy_pass http://dashboard_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============ 管理员服务 ============
        location /v1/admin {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://admin_auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============ WebSocket ============
        location /ws {
            proxy_pass http://dashboard_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # ============ 健康检查 ============
        location /health {
            return 200 '{"status":"UP","gateway":"nginx"}';
        }
    }
}
